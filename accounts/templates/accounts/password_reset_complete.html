<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Password Reset Complete</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e40af);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }

        h1 {
            color: #1e40af;
            margin-bottom: 20px;
        }

        h2 {
            color: #0f172a;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        a {
            display: block;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🔐 TrustVault</h1>

        <h2>Password Reset Successful!</h2>

        <p>
            Your password has been changed successfully.
            You can now log in using your new password.
        </p>

        <a href="{% url 'user_login' %}">Back to Login</a>
    </div>
</body>
</html>

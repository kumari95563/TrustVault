
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Forgot Password</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e40af);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; color: #1e40af; margin-bottom: 12px; }
        h2 { text-align: center; color: #0f172a; margin-bottom: 15px; }
        p { color: #64748b; text-align: center; line-height: 1.6; margin-bottom: 25px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        a { display: block; text-align: center; margin-top: 20px; color: #2563eb; text-decoration: none; }
    </style>
</head>

<body>
    <div class="card">
        <h1>🔐 TrustVault</h1>
        <h2>Forgot Password?</h2>

        <p>Enter your registered email address. We will send you a secure password reset link.</p>

        <form method="POST">
            {% csrf_token %}

            <label>Email Address</label>
            {{ form.email }}

            {% if form.email.errors %}
                <p>{{ form.email.errors }}</p>
            {% endif %}

            <button type="submit">Send Reset Link</button>
        </form>

        <a href="{% url 'user_login' %}">← Back to Login</a>
    </div>
</body>
</html>

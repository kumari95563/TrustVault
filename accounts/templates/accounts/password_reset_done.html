
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Check Email</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .icon { font-size: 55px; margin-bottom: 20px; }
        h1 { color: #0f172a; margin-bottom: 15px; }
        p { color: #64748b; line-height: 1.7; margin-bottom: 15px; }
        a {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }
        a:hover { background: #1d4ed8; }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">📧</div>

        <h1>Check Your Email</h1>

        <p>
            If an account exists with the email address you entered,
            a password reset link has been sent.
        </p>

        <p>
            Please check your Inbox and Spam folder.
            The secure link expires after 30 minutes.
        </p>

        <a href="{% url 'user_login' %}">Back to Login</a>
    </div>
</body>
</html>

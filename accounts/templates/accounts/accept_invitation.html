
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Secure Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        nav {
            background: #0f172a;
            color: white;
            padding: 20px 7%;
        }

        nav h2 {
            font-size: 24px;
        }

        .container {
            max-width: 550px;
            margin: 55px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .icon {
            font-size: 38px;
            margin-bottom: 15px;
        }

        h1 {
            color: #0f172a;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .details {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .details p {
            color: #334155;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 13px;
            border-radius: 7px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 20px;
            font-size: 13px;
        }

        @media(max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .card {
                padding: 23px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>🔐 TrustVault</h2>
    </nav>

    <div class="container">
        <div class="card">

            <div class="icon">🛡️</div>

            <h1>Secure Registration</h1>

            <p class="subtitle">
                Create your TrustVault account using your secure invitation.
            </p>

            <div class="details">
                <p><strong>Email:</strong> {{ invitation.email }}</p>
                <p><strong>Assigned Role:</strong> {{ invitation.get_role_display }}</p>
            </div>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label>Username</label>
                <input type="text" name="username"
                       placeholder="Create your username" required>

                <label>Password</label>
                <input type="password" name="password"
                       placeholder="Create a strong password" required>

                <label>Confirm Password</label>
                <input type="password" name="confirm_password"
                       placeholder="Enter password again" required>

                <button type="submit">Create Secure Account</button>
            </form>

        </div>
    </div>

    <footer>
        Protected Document Access | TrustVault
    </footer>

</body>
</html>

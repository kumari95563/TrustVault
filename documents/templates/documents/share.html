
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Share Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        nav {
            background: #0f172a;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 550px;
            margin: 65px auto;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #0f172a;
        }

        .document-name {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            color: #1d4ed8;
            font-weight: bold;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .messages {
            color: green;
            margin-bottom: 15px;
        }

        .errorlist {
            color: #dc2626;
        }
    </style>
</head>

<body>

<nav>
    <h2>TrustVault</h2>
    <a href="{% url 'dashboard' %}">Dashboard</a>
</nav>

<div class="container">

    <h1>Share Document</h1>
    <p>Securely give document access to an authorized user.</p>

    <div class="document-name">
        Document: {{ document.title }}
    </div>

    {% if messages %}
        {% for message in messages %}
            <p class="messages">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Share Securely</button>
    </form>

    <a class="back" href="{% url 'document_list' %}">
        Back to Documents
    </a>

</div>

</body>
</html>
